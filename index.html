<style>
/* Layout: one narrow column like a 手帳 page. A tactile-paving yellow band tops the page; yellow is used only for the band, the 10-person mark and active controls. */
:root{

  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --card:#18212A; --ink:#E8EDF0; --ink2:#9DABB6; --line:#2B3844;
  --ok:#59C08F; --ng:#E5776D; --soft:#222E39; color-scheme:dark;
}
*{box-sizing:border-box}

.wrap{max-width:700px;margin:0 auto;padding-top:26px;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;line-height:1.35}

/* title */
.hero{display:flex;flex-direction:column;gap:18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}

.body{display:flex;flex-direction:column;gap:12px;max-width:36em}

details{border-top:1px solid var(--line);padding-top:12px}

a{color:var(--ink);text-underline-offset:3px}

.tag{border-radius:3px;padding:3px 10px;font-size:14px;border:1.5px solid var(--ink)}
.tag.used{background:var(--tile);color:var(--tileink);border-color:var(--tileink);font-weight:700}
.tag.miss{border-style:dashed;color:var(--ink2);border-color:var(--ink2)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13px;min-width:460px;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{font:12px var(--f-m);color:var(--ink2);font-weight:400}
.foot{font-size:12px;color:var(--ink2);line-height:1.8}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}}

function makeQueue(){
  var ok=function(e){return e.lo<=S.age&&S.age<=e.hi&&!(e.once&&S.done.has(e.id))&&e.w(S)>0};
  var el=EV.filter(ok),q=el.filter(function(e){return e.must&&e.must(S)}).slice(0,2);
  var target=S.age<6?1:2,allowBig=!q.some(function(e){return e.big})&&Math.random()<.45,pool,pk;
  while(q.length<target){
    pool=el.filter(function(e){return q.indexOf(e)<0&&(e.big?allowBig:true)});
    if(!pool.length)break;
    pk=wpick(pool,function(e){return e.w(S)});
    if(pk.big)allowBig=false;
    q.push(pk);
  }
  return q;
}

function causeOfDeath(age){

  if(S.sub==='肢体不自由'){p.push(['誤嚥性肺炎',6],['不慮の事故(転倒・溺水など)',4])}

function deathScene(age,cause){

  else if(S.living==='group')place=wchoice([['グループホーム',70],['病院',30]]);
  else if(cause==='老衰')place=wchoice([['自宅',65],['病院',35]]);
  else place=wchoice([['病院',70],['自宅',26],['診療所',4]]);

function playerDeath(prev,nxt){
  var k=S.sexK,m=deathMult(),h0=cumH(k,prev),pE,tg,x;
  if(nxt===null)return null;
  pE=1-Math.exp(-(cumH(k,nxt)-h0)*m);
  if(!(Math.random()<pE))return null;
  tg=h0-Math.log(1-Math.random()*pE)/m;
  for(x=prev+1;x<nxt;x++){if(cumH(k,x)>=tg)return x}
  return nxt;
}

  var line;
  if(d>=65&&so>=55)line='自分の足で、あるいは誰かと一緒に、自分の暮らしをつくった人生だった。';
  else if(d>=50)line='思うようにならない日も多かったが、自分の居場所を探し続けた人生だった。';
  else line='制度や周りの理解に届かないまま過ぎた時間が、長かった人生だった。';
  var tags=function(a,cl){return a.length?'<div class="tags">'+a.map(function(id){return '<span class="tag '+cl+'" title="'+esc(BEN[id][1])+'">'+esc(BEN[id][0])+'</span>'}).join('')+'</div>':'<p class="small muted">なし</p>'};
  return '<section class="card"><p class="kicker mono">人生の肖像</p><h2>'+S.endAge+'歳、'+esc(S.cause)+'で幕を下ろした</h2>'+
  '<p class="cause"><b>死因</b>'+esc(S.cause)+' <span class="small muted">(日本の主な死因を参考にしたゲーム上の仮定)</span></p>'+
  '<p class="cause"><b>最期</b>'+esc(S.deathNote)+'</p>'+
  '<div class="body"><p>'+esc(S.muni.name)+'で、'+(S.dx?esc(S.sub)+'とともに':esc(S.sub)+'にあたる困りごとを、診断のないまま抱えて')+'生きた。'+esc(line)+'</p></div>'+
  gauges()+
  '<p class="small muted">最後の貯え '+Math.round(m/10000)+'万円・仕事 '+({null:'なし',regular:'一般企業で働いた',general:'障害者雇用で働いた',a:'A型',b:'B型',none:'働かなかった'}[S.work])+'・きょうだい '+(f.sibs.length?f.sibs.length+'人':'なし')+'・パートナー '+(S.partner?'いた':(f.lastPartner?'いた(のちに別れ・死別)':'なし'))+'・子 '+(f.kids.length?f.kids.length+'人':'なし')+'</p>'+
  '<h3 style="font-size:15px">届いた制度</h3>'+tags(used,'used')+
  '<h3 style="font-size:15px">知らないまま、または使わないまま過ぎた制度</h3>'+tags(miss_,'miss')+
  '<p class="small muted">制度は、知って、申請して、はじめて届く。10人に1人の人生を支える仕組みは、ここに挙げたよりずっと多い。</p>'+
  '<button class="btn" id="again">別の人生を生きる</button></section>';
}
function autoScreen(){
  var f=S.feed,n=nextStepAge();
  var items=f.length?f.map(function(x){if(x.list)return '<div class="feed"><p class="kicker mono">'+esc(x.k)+' ・ '+esc(x.title)+'</p><ul class="tll">'+x.list.map(function(l){return '<li><b>'+l.age+'歳</b> '+esc(l.t)+'</li>'}).join('')+'</ul></div>';return '<div class="feed">'+(x.title?'<p class="kicker mono">'+(x.age!=null?x.age+'歳 ・ ':'')+esc(x.k||'')+' ・ '+esc(x.title)+'</p>':'')+'<p>'+esc(x.text)+'</p>'+chipsHTML(x.chips)+tlNote(x.tl,x.text)+'</div>'}).join(''):'<p>大きな出来事はなく、日々が過ぎていく。</p>';
  return '<section class="card auto"><p class="kicker mono">'+S.age+'歳 ・ 日々のくらし</p><h2>時が流れる</h2>'+(S.note?'<p class="small muted">'+esc(S.note)+'</p>':'')+
   '<div class="feeds">'+items+'</div>'+
   '<div class="pg"><div class="bar"><i id="pg-fill" style="width:'+Math.min(100,UI.prog/STEP_MS*100)+'%"></i></div><p class="small muted"><span id="pg-left"></span>'+(n===null?'':'　つぎは'+n+'歳')+'</p></div>'+
   '<button class="btn ghost" id="skip" type="button">いますぐ進める</button></section>';
}
function ctlHTML(){
  var sp=[1,2,4,8].map(function(k){return '<button id="sp-'+k+'" type="button" aria-pressed="'+(UI.speed===k)+'">×'+k+'</button>'}).join('');
  return '<section class="card" aria-label="時間の流れ"><p class="kicker mono">時間の流れ(基本は1分で1段階)</p><div class="seg sp"><button id="sp-pause" type="button" aria-pressed="'+UI.paused+'">'+(UI.paused?'再開':'停止')+'</button>'+sp+'</div></section>';
}
function updateAuto(){
  var f=document.getElementById('pg-fill'),l=document.getElementById('pg-left');
  if(f&&f.style)f.style.width=Math.min(100,UI.prog/STEP_MS*100)+'%';
  if(l){var left=Math.max(0,Math.ceil((STEP_MS-UI.prog)/UI.speed/1000));l.textContent=UI.paused?'一時停止中':'あと'+left+'秒(×'+UI.speed+')'}
}
function bindCtl(){
  var q=function(id){return document.getElementById(id)};
  [1,2,4,8].forEach(function(k){var b=q('sp-'+k);if(b)b.onclick=function(){UI.speed=k;UI.paused=false;refreshCtl()}});
  var p=q('sp-pause');if(p)p.onclick=function(){UI.paused=!UI.paused;refreshCtl()};
}
function refreshCtl(){var c=$('#ctl');if(c){c.innerHTML=ctlHTML();bindCtl()}updateAuto()}
function bind(){
  var q=function(id){return document.getElementById(id)};
  if(q('m-birth'))q('m-birth').onclick=function(){UI.mode='birth';render()};
  if(q('m-data'))q('m-data').onclick=function(){UI.mode='data';render()};
  if(q('go'))q('go').onclick=startLife;
  if(q('begin'))q('begin').onclick=function(){
    S.queue=[];
    if(S.onset===0)S.queue.push(triggerOnset());
    S.queue=S.queue.concat(makeQueue());
    S.feed=[];showNext();
  };
  if(q('skip'))q('skip').onclick=function(){advance()};
  if(q('next'))q('next').onclick=proceed;
  if(q('again'))q('again').onclick=function(){UI.screen='title';S=null;render()};
  var btns=document.querySelectorAll('.choice');
  Array.prototype.forEach.call(btns,function(b){b.onclick=function(){var i=+b.getAttribute('data-i');choose(i)}});
}
var MQ=window.matchMedia?window.matchMedia('(max-width:600px)'):null;
function placeCtl(){var bar=document.getElementById('ctlbar'),a=document.getElementById('colA');
  if(!bar||!a||!a.querySelector)return;
  var inA=a.querySelector('#ctl');
  if(MQ&&MQ.matches){if(inA){if(!bar.firstChild)bar.appendChild(inA);else if(inA.parentNode)inA.parentNode.removeChild(inA)}}
  else{if(bar.firstChild&&bar.removeChild)bar.removeChild(bar.firstChild)}}
if(MQ&&MQ.addListener)MQ.addListener(placeCtl);
function render(){
  var h='',title=(UI.screen==='title'||!S);
  if(S&&S.fam)sanitize();
  if(title)h=titleScreen();
  else if(UI.screen==='birth')h=birthScreen();
  else if(UI.screen==='auto')h=autoScreen();
  else if(UI.screen==='event')h=eventScreen();
  else if(UI.screen==='result')h=resultScreen();
  else if(UI.screen==='end')h=endScreen();
  $('#app').innerHTML=h;
  $('#shell').className='app'+(title?' is-title':'');
  $('#colA').hidden=title;$('#colC').hidden=title;$('#tlm').hidden=title;
  if(title){var cb=document.getElementById('ctlbar');if(cb)cb.innerHTML=''}
  if(!title){
    $('#colA').innerHTML='<div id="ctl">'+ctlHTML()+'</div>'+statusHTML()+famHTML();placeCtl();
    $('#colC').innerHTML=sideHTML();
    $('#tlm').innerHTML=tlHTML();
  }
  bind();
  if(!title)bindCtl();
  updateAuto();
  try{$('#app').scrollTop=0}catch(e){}
}
var lastT=Date.now();
setInterval(function(){
  var now=Date.now(),dt=Math.min(now-lastT,5000);lastT=now;
  if(!S||UI.screen!=='auto'||UI.paused)return;
  UI.prog+=dt*UI.speed;
  if(UI.prog>=STEP_MS){advance();return}
  updateAuto();
},250);
/* ---- ページを開いてからの推計カウンター ---- */
var T0=Date.now(),YR=31557600,INC=550000,DEAD=200000;
function tick(){
  var t=(Date.now()-T0)/1000,inc=Math.floor(t*INC/YR),dead=Math.floor(t*DEAD/YR),m=Math.floor(t/60),sec=Math.floor(t%60);
  var set=function(id,v){var el=document.getElementById(id);if(el)el.textContent=v};
  set('c-time',m+':'+(sec<10?'0':'')+sec);
  set('c-inc','+'+inc.toLocaleString('ja-JP'));
  set('c-dead',dead.toLocaleString('ja-JP'));
  set('c-net','+'+(inc-dead).toLocaleString('ja-JP'));
}
(function(){
  var set=function(id,v){var el=document.getElementById(id);if(el)el.textContent=v};
  set('c-inc-r','人(約'+Math.round(YR/INC)+'秒に1人)');
  set('c-dead-r','人(約'+Math.round(YR/DEAD)+'秒に1人)');
  tick();setInterval(tick,1000);
  var ov=document.getElementById('ov'),ob=document.getElementById('ov-body');
  if(ob)ob.innerHTML='<h2>このゲームのデータ</h2>'+dataTable()+sourcesHTML().replace('<details>','<details open>')+'<p class="foot">上部の増加数・死者数は、公式の実数ではなく、白書の数字から逆算した推計です。フィクションのシミュレーションです。制度の内容・金額・所得制限は調べた時点の公開情報の要約で、変更されることがあります。実際の手続きや相談は、お住まいの市区町村の障害福祉窓口で確認してください。</p>';
  var b=document.getElementById('btn-data'),c=document.getElementById('ov-close');
  if(b)b.addEventListener('click',function(){ov.hidden=false});
  if(c)c.addEventListener('click',function(){ov.hidden=true});
  if(ov)ov.addEventListener('click',function(ev){if(ev.target===ov)ov.hidden=true});
})();
render();
})();
</script>
